<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gothic Valentiada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cinzel:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              mono: ['"Courier Prime"', 'monospace'],
              gothic: ['"Cinzel"', 'serif'],
              script: ['"Pinyon Script"', 'cursive'],
            },
            colors: {
              'wed-black': '#050505',
              'wed-paper': '#e3dace',
              'wed-purple': '#320a40',
              'wed-dark-purple': '#1a0524',
              'wed-silver': '#a1a1aa',
              'wed-ink': '#111111',
              'wed-pink': '#ff007f', // Enid's Pink
            },
            animation: {
              'flicker': 'flicker 0.15s infinite',
              'slow-spin': 'spin 10s linear infinite',
              'reverse-spin': 'spin 15s linear infinite reverse',
              'rain': 'rain 0.5s linear infinite',
              'float-leaf': 'floatLeaf 4s ease-in-out infinite',
              'fade-in': 'fadeIn 2s ease-out forwards',
            },
            keyframes: {
              flicker: {
                '0%': { opacity: 0.9 },
                '50%': { opacity: 1.0 },
                '100%': { opacity: 0.9 },
              },
              rain: {
                '0%': { transform: 'translateY(0)' },
                '100%': { transform: 'translateY(100vh)' },
              },
              floatLeaf: {
                '0%': { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                '100%': { transform: 'translateY(100px) rotate(360deg)', opacity: 0 },
              },
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050505;
        color: #e3dace;
        overflow: hidden;
        /* Custom Gothic Cursor */
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23ff007f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.1 12 6"/><path d="m5.1 8-2.9-.8"/><path d="m6 12-1.9 2"/><path d="M7.2 2.2 8 5.1"/><path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z"/></svg>') 12 12, auto;
      }
      
      .grain {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.08;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .corner-border {
         position: absolute;
         width: 20px;
         height: 20px;
         border-color: #ff007f; /* Pink accents */
         border-style: solid;
         transition: all 0.5s ease;
         opacity: 0.6;
      }
      .c-tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
      .c-tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
      .c-bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
      .c-br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

      .rain-layer {
        position: absolute;
        width: 1px;
        height: 50px;
        background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.2));
        animation: rain 0.8s linear infinite;
      }
    </style>
